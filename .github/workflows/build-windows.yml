name: Build UZYRO for Windows

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          architecture: x64

      - name: Install dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-cache-dir -r requirements.txt
          python -m pip install --disable-pip-version-check --no-cache-dir --force-reinstall Pillow==10.4.0

      - name: Verify text shaping engine
        shell: powershell
        run: |
          python -c "import struct, PIL; from PIL import features; assert struct.calcsize('P') * 8 == 64; assert features.check('raqm'); assert features.check('fribidi'); assert features.check('harfbuzz'); print('Pillow', PIL.__version__, 'RAQM/FriBidi/HarfBuzz: OK')"

      - name: Run tests
        shell: powershell
        run: .\run_tests.ps1 -Python python

      - name: Build executable
        shell: powershell
        run: .\build_exe.ps1

      - name: Verify executable
        shell: powershell
        run: |
          if (-not (Test-Path .\dist\UZYRO.exe)) {
            throw "UZYRO.exe was not created"
          }
          Get-Item .\dist\UZYRO.exe | Select-Object Name, Length, LastWriteTime

      - name: Upload Windows executable
        uses: actions/upload-artifact@v7
        with:
          name: UZYRO-Windows
          path: dist/UZYRO.exe
          if-no-files-found: error
          retention-days: 30
