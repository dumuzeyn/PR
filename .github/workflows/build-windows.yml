name: Build PhotoRedactor for Windows

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Run tests
        shell: powershell
        run: |
          $coreOutput = python -m pytest -q tests/test_rendering.py tests/test_tile_history.py tests/test_retouch.py tests/test_retouch_quality.py tests/test_selection_masks.py tests/test_shape_geometry.py tests/test_tool_smoke.py tests/test_models_and_history.py tests/test_clone_workflow.py tests/test_gradient_engine.py tests/test_roadmap_features.py 2>&1
          $coreExit = $LASTEXITCODE
          $coreOutput | Write-Output
          if ($coreExit -ne 0) {
            "## Ошибка основных тестов" | Add-Content $env:GITHUB_STEP_SUMMARY
            $coreOutput | Add-Content $env:GITHUB_STEP_SUMMARY
            exit $coreExit
          }

          # Tcl/Tk on Windows does not reliably support repeated root teardown in one process.
          $uiTests = python -m pytest --collect-only -q tests/test_startup.py tests/test_tool_palette.py |
            Where-Object { $_ -like 'tests/*::*' }
          foreach ($test in $uiTests) {
            $uiOutput = python -m pytest -q $test 2>&1
            $uiExit = $LASTEXITCODE
            $uiOutput | Write-Output
            if ($uiExit -ne 0) {
              "## Ошибка UI-теста: $test" | Add-Content $env:GITHUB_STEP_SUMMARY
              $uiOutput | Add-Content $env:GITHUB_STEP_SUMMARY
              exit $uiExit
            }
          }

      - name: Build executable
        shell: powershell
        run: .\build_exe.ps1

      - name: Verify executable
        shell: powershell
        run: |
          if (-not (Test-Path .\dist\PhotoRedactor.exe)) {
            throw "PhotoRedactor.exe was not created"
          }
          Get-Item .\dist\PhotoRedactor.exe | Select-Object Name, Length, LastWriteTime

      - name: Upload Windows executable
        uses: actions/upload-artifact@v7
        with:
          name: PhotoRedactor-Windows
          path: dist/PhotoRedactor.exe
          if-no-files-found: error
          retention-days: 30
