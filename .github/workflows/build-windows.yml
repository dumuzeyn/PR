name: Build UZYRO for Windows

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12.0"
          architecture: x64

      - name: Install dependencies
        shell: powershell
        run: |
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install --disable-pip-version-check --no-cache-dir -r requirements-dev.txt
          (Resolve-Path .\uzyro\assets\native).Path | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Audit dependencies
        shell: powershell
        run: .\.venv\Scripts\python.exe -m pip_audit -r requirements.txt --progress-spinner off

      - name: Verify text shaping engine
        shell: powershell
        run: |
          $diagnostics = .\.venv\Scripts\python.exe -c "import hashlib, json, pathlib, platform, struct, PIL; from PIL import Image, features; native=pathlib.Path(Image.core.__file__); print(json.dumps({'python': platform.python_version(), 'bits': struct.calcsize('P') * 8, 'pillow': PIL.__version__, 'pillow_path': PIL.__file__, 'native_path': str(native), 'native_sha256': hashlib.sha256(native.read_bytes()).hexdigest(), 'features': features.get_supported()}, sort_keys=True))"
          $diagnostics | Write-Output
          .\.venv\Scripts\python.exe -c "from PIL import features; raise SystemExit(0 if features.check('raqm') else 1)"
          if ($LASTEXITCODE -ne 0) {
            $detail = ($diagnostics -join "`n").Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Output "::error title=RAQM недоступен::$detail"
            exit 1
          }

      - name: Run core tests with branch coverage
        shell: powershell
        run: .\run_tests.ps1 -Python .\.venv\Scripts\python.exe -Mode Core -Coverage

      - name: Run security tests
        shell: powershell
        run: .\run_tests.ps1 -Python .\.venv\Scripts\python.exe -Mode Security

      - name: Run performance regression tests
        shell: powershell
        run: .\run_tests.ps1 -Python .\.venv\Scripts\python.exe -Mode Performance

      - name: Run UI tests
        shell: powershell
        run: .\run_tests.ps1 -Python .\.venv\Scripts\python.exe -Mode Ui

      - name: Build executable
        shell: powershell
        run: .\build_exe.ps1 -Python .\.venv\Scripts\python.exe

      - name: Verify executable
        shell: powershell
        run: |
          if (-not (Test-Path .\dist\UZYRO.exe)) {
            throw "UZYRO.exe was not created"
          }
          Get-Item .\dist\UZYRO.exe | Select-Object Name, Length, LastWriteTime

      - name: Upload Windows executable
        uses: actions/upload-artifact@v7
        with:
          name: UZYRO-Windows
          path: dist/UZYRO.exe
          if-no-files-found: error
          retention-days: 30
