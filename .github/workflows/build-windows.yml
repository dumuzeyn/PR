name: Build PhotoRedactor for Windows

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Run tests
        run: python -m unittest discover -s tests -q

      - name: Build executable
        shell: powershell
        run: .\build_exe.ps1

      - name: Verify executable
        shell: powershell
        run: |
          if (-not (Test-Path .\dist\PhotoRedactor.exe)) {
            throw "PhotoRedactor.exe was not created"
          }
          Get-Item .\dist\PhotoRedactor.exe | Select-Object Name, Length, LastWriteTime

      - name: Upload Windows executable
        uses: actions/upload-artifact@v7
        with:
          name: PhotoRedactor-Windows
          path: dist/PhotoRedactor.exe
          if-no-files-found: error
          retention-days: 30
