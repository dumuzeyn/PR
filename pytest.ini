[pytest]
addopts = --strict-markers
testpaths = tests
markers =
    smoke: minimal catastrophic-failure checks
    integration: multi-module or external-boundary integration tests
    ui: tests that create Tk windows or the full UZYRO application
    ui_isolated: native UI boundary that must run in a fresh Tcl process
    security: trust-boundary and malformed-input regression tests
    performance: benchmark-like regression checks excluded from default correctness runs
    slow: deterministic tests intentionally excluded from the fast feedback loop
    hardware: optional checks that require real GPU, printer profiles, or OS facilities
filterwarnings =
    error::pytest.PytestUnknownMarkWarning
